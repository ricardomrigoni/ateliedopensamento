  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='1.5' y='1.5' width='37' height='37' rx='9' fill='%232f5d57'/%3E%3Cpath d='M11 29c2.5-9 6-15 9-15s4.5 6 9 15' fill='none' stroke='%23f6f1e7' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M14.5 23.5h11' stroke='%23f6f1e7' stroke-width='2.2' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='9.5' r='2.3' fill='%23d79b78'/%3E%3C/svg%3E">
  <!-- Aplica tema e tamanho de fonte antes de desenhar a página (evita piscar) -->
  <script>
    (function () {
      try {
        var d = JSON.parse(localStorage.getItem('atelie-do-pensamento:v1') || '{}');
        var p = d.preferencias || {};
        if (p.tema === 'claro') document.documentElement.dataset.theme = 'light';
        if (p.tema === 'escuro') document.documentElement.dataset.theme = 'dark';
        if (p.fonte) document.documentElement.dataset.fonte = p.fonte;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/estilos.css">
</head>
